name: check boards

on:
  schedule:
    # 매일 00:00 UTC = 09:00 KST
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      preview_site_id:
        description: "파싱 테스트할 사이트 ID (비우면 일반 확인 실행)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: check-boards
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preview site parsing
        if: ${{ inputs.preview_site_id != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py --preview "${{ inputs.preview_site_id }}"

      - name: Check boards
        if: ${{ inputs.preview_site_id == '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Commit state
        if: ${{ inputs.preview_site_id == '' }}
        run: |
          if git diff --quiet -- state.json; then
            echo "state.json 변경 없음 — 커밋 스킵"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "[bot] update state"
          for i in 1 2 3 4; do
            git push && exit 0
            echo "push 실패 — 재시도 $i"
            sleep $((2 ** i))
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
          done
          git push
